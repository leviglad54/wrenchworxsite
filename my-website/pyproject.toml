[project]
name = "wrenchworx-site"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<6",
    "dj-database-url>=2.3,<3",
    "psycopg[binary]>=3.2,<4",
    "whitenoise>=6.9,<7",
    "Pillow>=11,<13",
]

[tool.uv]
package = false

[tool.vercel.scripts]
build = 'if [ "$VERCEL_ENV" = "production" ]; then DATABASE_URL="$DATABASE_URL_UNPOOLED" python manage.py migrate --noinput; fi'
